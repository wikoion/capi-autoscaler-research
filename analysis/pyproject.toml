[project]
name = "capi-bench-analysis"
version = "0.1.0"
description = "Benchmark analysis notebook and helpers for the capi-autoscaler research project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capi_bench_analysis"]
